spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: studyon-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studyon}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
